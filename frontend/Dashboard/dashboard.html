<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FlipAha Dashboard</title>

    <!-- Bootstrap for layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="dashboard.css" />

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

</head>

<body class="container py-4">

    <h1 class="mb-4">📊 FlipAha Dashboard</h1>

    <!-- KPI cards -->
    <div class="row mb-5">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h6>Daily Active Users</h6>
                <h2 id="dailyCount">–</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h6>Weekly Active Users</h6>
                <h2 id="weeklyCount">–</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h6>Monthly Active Users</h6>
                <h2 id="monthlyCount">–</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 text-center">
                <h6>Inactive Users</h6>
                <h2 id="inactiveCount">–</h2>
            </div>
        </div>
    </div>
    
    <div class="row mt-5">
        <!-- Active Users Chart -->
        <div class="col-md-6">
            <h4 class="text-center">Active Users</h4>
            <svg id="activeUsersChart"></svg>
        </div>

        <!-- New vs Returning Chart -->
        <div class="col-md-6">
            <h4 class="text-center">New vs Returning Users</h4>
            <svg id="newReturningChart"></svg>
        </div>
    </div>
    
    <div class="row mt-5">
        <!-- Question Volume Chart -->
        <div class="col-md-6">
            <h4 class="text-center">Question Volume (Last 7 Days)</h4>
            <svg id="questionVolumeChart"></svg>
        </div>
        <div class="col-md-6">
            <h4 class="text-center">Typing vs Suggestion (Last 7 Days)</h4>
            <svg id="inputMethodTrendChart"></svg>
        </div>
    </div>


    <!-- JS -->
    <script src="dashboard.js"></script>
</body>
</html>
