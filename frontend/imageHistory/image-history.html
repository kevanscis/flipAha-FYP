<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flipAha! - Image History</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for rendering LaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom styles -->
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container scrollable-page">
        <!-- Header -->
        <header class="row">
            <div class="col"></div>
            <div class="col text-center">
                <h1>
                    <span class="flip">Flip</span><span class="aha">Aha</span>!
                </h1>
                <p>Your Personal Online Math Tutor</p>
                <div class="header-nav">
                    <a class="nav-button" href="/"><i class="fas fa-comments"></i> Chat Tutor</a>
                    <div id="dashboardButton">
                        <a class="nav-button" href="/dashboard"><i class="fas fa-chart-bar"></i> Dashboard</a>
                    </div>
                    <button class="nav-button active"><i class="fas fa-history"></i> Image History</button>
                    <div id="authButtons">
                        <a class="nav-button" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </div>
                    <div id="logoutButton">
                        <button class="nav-button" onclick="goLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                    
                </div>
            </div>
            <div class="col"></div>
        </header>

        <!-- Main Content -->
        <main class="tutor-main">
            <div class="image-history-container">

                <!-- Error Message -->
                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <!-- Loading State -->
                <div id="loadingState" class="loading-spinner" style="display: none;">
                    <div class="spinner"></div>
                    <span>Loading your images...</span>
                </div>

                <!-- Stats Section -->
                <div id="statsSection" class="history-stats" style="display: none;">
                    <div class="stat-item">
                        <div class="stat-label">Total Images</div>
                        <div class="stat-value" id="totalImages">0</div>
                    </div>
                </div>

                <!-- Image Gallery -->
                <div id="gallerySection" style="display: none;">
                    <div id="imageGallery" class="image-gallery"></div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📷</div>
                    <div class="empty-state-title">No Images Yet</div>
                    <div class="empty-state-text">You haven't scanned any equations yet.</div>
                    <div class="empty-state-action">
                        <a href="/"><i class="fas fa-camera"></i> Start Scanning</a>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 FlipAha - Math Tutoring Made Easy</p>
        </footer>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="closeModal">&times;</button>
            <img id="modalImage" class="modal-image" alt="Full image">
            
            <div class="modal-latex-section" id="modalLatexSection" style="display: none;">
                <label class="modal-latex-label">LaTeX Code:</label>
                <textarea class="modal-latex-code" id="modalLatexCode" rows="4"></textarea>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../nav.js"></script>
    <script src="image-history.js"></script>
</body>
</html>
