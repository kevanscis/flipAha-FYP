<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipAha - Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <h1>
          <span class="flip">Flip</span><span class="aha">Aha</span>!
        </h1>
        <div class="header-nav">
          <a class="nav-button" href="/"><i class="fas fa-comments"></i> Chat Tutor</a>
        </div>
      </div>
      <p>Your Personal Online Math Tutor</p>
    </header>

    <!-- Main Content -->
    <main class="tutor-main auth-layout">
      <div class="auth-card">
        <h2>Login</h2>
        <form id="loginForm">
          <p id="statusMessage" class="status-message"></p>

          <label for="username">Username</label>
          <input id="username" type="text" class="form-control" placeholder="Username" />

          <label for="password">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Password" />

          <button type="submit" class="btn btn-submit">
            <span>Login</span>
            <span class="icon">→</span>
          </button>
        </form>

        <div class="auth-link">
          <p>Don't have an account? <a href="/register">Register here</a></p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 FlipAha - Math Tutoring Made Easy</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="/login.js" defer></script>
</body>
</html>
