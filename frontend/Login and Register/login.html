<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipAha - Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="/styles.css" />

  <style>
    /* Auth page layout */
    .tutor-main {
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .auth-card h2 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #111827;
    }

    .auth-card label {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      display: block;
    }

    .auth-card .form-control {
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .auth-card .form-control:focus {
      border-color: #f4623a;
      box-shadow: 0 0 0 3px rgba(244, 98, 58, 0.15);
    }

    .auth-card .btn-submit {
      width: 100%;
      padding: 0.7rem;
      background: linear-gradient(135deg, #f4623a, #d94027);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-card .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 98, 58, 0.4);
    }

    .auth-link {
      text-align: center;
      margin-top: 1.25rem;
      color: #6b7280;
    }

    .auth-link a {
      color: #f4623a;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .status-message {
      color: #dc2626;
      text-align: center;
      margin-bottom: 1rem;
    }

    .header-nav {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .nav-button {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="row">
      <div class="col"></div>
      <div class="col text-center">
        <h1>
          <span class="flip">Flip</span><span class="aha">Aha</span>!
        </h1>
        <p>Your Personal Online Math Tutor</p>
        <div class="header-nav">
          <a class="nav-button" href="/"><i class="fas fa-comments"></i> Chat Tutor</a>
        </div>
      </div>
      <div class="col"></div>
    </header>

    <!-- Main Content -->
    <main class="tutor-main">
      <div class="auth-card">
        <h2>Login</h2>
        <form id="loginForm">
          <p id="statusMessage" class="status-message"></p>

          <label for="username">Username</label>
          <input id="username" type="text" class="form-control" placeholder="Username" />

          <label for="password">Password</label>
          <input id="password" type="password" class="form-control" placeholder="Password" />

          <button type="submit" class="btn btn-submit">
            <span>Login</span>
            <span class="icon">→</span>
          </button>
        </form>

        <div class="auth-link">
          <p>Don't have an account? <a href="/register">Register here</a></p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; 2026 FlipAha - Math Tutoring Made Easy</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="/login.js" defer></script>
</body>
</html>
