<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flipAha! - Online Math Tutor</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css">
    
    <!-- MathLive for editing -->
    <link rel="stylesheet" href="https://unpkg.com/mathlive@0.104.0/dist/mathlive-static.css">
    
    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css">
    <style>
        .header-nav {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button:hover,
        .nav-button.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>
                <span class="flip">Flip</span><span class="aha">Aha</span>!
            </h1>
            <p>Your Personal Online Math Tutor</p>
            <div class="header-nav">
                <a href="index.html" class="nav-button active">💬 Chat Tutor</a>
                <a href="equation-scanner.html" class="nav-button">📸 Equation Scanner</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="tutor-main">
            <!-- Chat Section -->
            <div class="chat-section">
                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message" id="welcomeMessage">
                        <h2>Welcome to FlipAha! 👋</h2>
                        <p>Ask me any math question and I'll help you understand it step by step.</p>
                    </div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <form class="question-form" id="questionForm">
                    <div class="input-wrapper">
                        <div class="input-dropdown-wrapper">
                            <math-field
                                id="questionInput"
                                class="question-input"
                                smart-mode
                                virtual-keyboard-mode="manual"
                            ></math-field>
                            
                            <!-- Suggestions dropdown -->
                            <ul class="suggestion-list" id="suggestionList" style="display: none;"></ul>
                        </div>
                        
                        <button type="submit" class="btn btn-submit" id="submitBtn">
                            <span class="icon">→</span>
                        </button>
                    </div>
                </form>
                
                <div id="responseMessage" class="response-message" style="display: none;"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 FlipAha - Math Tutoring Made Easy</p>
        </footer>


    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"></script>
    <script src="https://unpkg.com/mathlive@0.104.0"></script>
    <script src="nav.js"></script>
    <script src="mathToLatex.js"></script>
    <script src="app.js"></script>
</body>
</html>
